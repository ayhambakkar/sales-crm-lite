# Example Nginx virtual host for Sales CRM Lite.
#
# Suggested path:
#   /etc/nginx/sites-available/sales-crm-lite
#
# Replace:
#   crm.example.com
#   /var/www/sales-crm-lite/public
#   /run/php/php8.2-fpm.sock
#
# This file is HTTP-first so `nginx -t` works before certificates exist.
# Run `certbot --nginx -d crm.example.com` after enabling this site.

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    root /var/www/sales-crm-lite/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/sales-crm-lite.access.log;
    error_log /var/log/nginx/sales-crm-lite.error.log;

    client_max_body_size 10m;

    # Certbot uses this path before HTTPS is issued.
    location /.well-known/acme-challenge/ {
        allow all;
    }

    # The PHP app also sends security headers for dynamic responses.
    # These Nginx headers protect static files too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # The server root points to /public, but keep dotfiles blocked.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Avoid executing or serving unexpected PHP files outside index.php.
    location ~* /(?:storage|database|config|resources|src|tests|vendor|node_modules)/ {
        deny all;
    }
}
